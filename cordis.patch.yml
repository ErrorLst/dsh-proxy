# dsh bundle layer: mount the host half (lib/index.js via the package root
# export) and the browser client half (lib/client.js via the ./client export,
# declared in dsh.client). Host half: proxy dispatcher, health monitoring,
# status endpoint. Browser half: settings card, broken-proxy alert popup.
- insert:
    - id: dsh-proxy
      name: '@dsh-external/dsh-proxy'
